<!-- NAML 2027, HEADER block for the WordPress theme Header (Appearance > Editor > Patterns > Template parts > Header).
     Replace the theme's navigation with one Custom HTML block containing this file. No JavaScript needed. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
.naml{--teal:#16929E;--dteal:#02565E;--deep:#013A40;--coral:#FF544B;--yellow:#FFC54B;--orange:#FFA04B;
  --paper:#fff;--coral-ink:#C2352D;--mist:#E8F4F5;--ink:#0D2A2D;--muted:#4C6669;--line:#CFE3E5;
  font:16px/1.6 Barlow,system-ui,sans-serif;color:var(--ink);background:var(--paper);overflow-x:clip}
.naml *{box-sizing:border-box;min-width:0}
.naml h1,.naml h2,.naml h3{font-family:"Bebas Neue",Barlow,sans-serif;font-weight:400;line-height:1.02;margin:0;text-wrap:balance;letter-spacing:.01em}
.naml p{margin:0 0 1em}
.naml a{color:inherit}
.naml img,.naml svg{max-width:100%}
.naml .wrap{max-width:1240px;margin:0 auto}
.naml .band{padding:clamp(44px,6vw,92px) max(5vw,16px)}
.naml .mist{background:var(--mist)}
.naml .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.naml .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 24px;border-radius:4px;font-weight:700;text-decoration:none;border:2px solid transparent;transition:transform .15s,box-shadow .15s,background .2s;white-space:nowrap}
.naml .btn:focus-visible,.naml a:focus-visible,.naml button:focus-visible{outline:3px solid var(--orange);outline-offset:3px}
.naml .btn.pri{background:var(--yellow);color:var(--deep);box-shadow:4px 4px 0 var(--coral)}
.naml .btn.pri:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--coral)}
.naml .btn.sec{border-color:rgba(255,255,255,.6);color:#fff}
.naml .btn.sec:hover{background:rgba(255,255,255,.12)}
.naml .btn.dark{background:var(--dteal);color:#fff;box-shadow:4px 4px 0 var(--yellow)}
.naml .btn.dark:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--yellow)}
.naml .btn.line{border-color:var(--dteal);color:var(--dteal)}
.naml .btn.line:hover{background:var(--mist)}
.naml .actions{display:flex;flex-wrap:wrap;gap:14px}

.naml .top{background:rgba(255,255,255,.97);backdrop-filter:saturate(1.4) blur(6px);border-bottom:4px solid var(--yellow);padding:8px max(5vw,16px);position:sticky;top:0;z-index:20;box-shadow:0 6px 18px rgba(1,58,64,.08)}
.naml .top .wrap{display:flex;align-items:center;gap:20px;position:relative}
.naml .brand{flex:none}
.naml .brand img{width:132px;height:auto;display:block}
.naml .menu{display:flex;align-items:center;gap:2px;margin-left:auto}
.naml .menu a{position:relative;text-decoration:none;font-weight:600;color:var(--dteal);padding:10px 12px;min-height:44px;display:inline-flex;align-items:center;white-space:nowrap;border-radius:4px}
.naml .menu a::after{content:"";position:absolute;left:12px;right:12px;bottom:4px;height:3px;border-radius:2px;background:var(--coral);transform:scaleX(0);transform-origin:left;transition:transform .2s}
.naml .menu a:hover::after,.naml .menu a[aria-current=page]::after{transform:scaleX(1)}
.naml .menu a[aria-current=page]{color:var(--deep)}
.naml .hsub{flex:none}
.naml .mnav{display:none;flex:none}
.naml .mnav summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:10px;min-height:44px;padding:0 14px;border:2px solid var(--dteal);border-radius:4px;color:var(--dteal);font-weight:700}
.naml .mnav summary::-webkit-details-marker{display:none}
.naml .mnav summary:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.naml .bars{display:grid;gap:4px;width:18px}
.naml .bars i{display:block;height:2px;background:currentColor;border-radius:2px;transition:transform .2s,opacity .2s}
.naml .mnav[open] .bars i:nth-child(1){transform:translateY(6px) rotate(45deg)}
.naml .mnav[open] .bars i:nth-child(2){opacity:0}
.naml .mnav[open] .bars i:nth-child(3){transform:translateY(-6px) rotate(-45deg)}
.naml .mnav nav{position:absolute;left:calc(-1 * max(5vw,16px));right:calc(-1 * max(5vw,16px));top:calc(100% + 12px);background:#fff;display:flex;flex-direction:column;padding:8px max(5vw,16px) 18px;border-bottom:4px solid var(--yellow);box-shadow:0 18px 30px rgba(1,58,64,.18)}
.naml .mnav nav a{text-decoration:none;font-weight:600;color:var(--dteal);padding:12px 0;border-bottom:1px solid var(--line);min-height:44px}
.naml .mnav nav a[aria-current=page]{color:var(--coral-ink)}
.naml .mnav nav .btn{margin-top:14px;border-bottom:0;justify-content:center;color:var(--deep)}
@media (max-width:1240px){
  .naml .menu{display:none}
  .naml .mnav{display:block}
  .naml .hsub{margin-left:auto;min-height:44px;padding:0 16px}
}
.naml .mnav .mlbl{font:700 15px/1 Barlow,sans-serif;letter-spacing:0;text-transform:none}.naml .mnav .mlbl::after{content:"Menu"}.naml .mnav[open] .mlbl::after{content:"Close"}
@media (max-width:420px){.naml .top .wrap{gap:10px}.naml .brand img{width:112px}.naml .hsub{padding:0 12px;font-size:14px}.naml .hsub span{display:none}.naml .mnav summary{padding:0 12px}}
@media (max-width:340px){.naml .hsub{display:none}.naml .mnav{margin-left:auto}}

.naml .hero{background:linear-gradient(180deg,var(--dteal) 0%,var(--deep) 100%);color:#fff;position:relative;overflow:hidden}
.naml .stripe{height:10px;background:linear-gradient(90deg,var(--yellow) 0 60%,var(--orange) 60% 80%,var(--coral) 80%)}
.naml .hero .wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(24px,4vw,56px);align-items:center}
.naml .logo{display:block;width:100%;max-width:520px;height:auto;margin:0 0 4px -10px}
.naml .edition{font:400 clamp(30px,3.4vw,44px)/1 "Bebas Neue",sans-serif;color:var(--yellow);margin:16px 0 6px}
.naml .edition span{color:#fff}
.naml .meta{display:flex;flex-wrap:wrap;gap:6px 26px;margin:10px 0 26px;font-size:18px;font-weight:600;color:#D8EEF0}
.naml .count{margin-top:30px;padding-top:22px;border-top:1px solid rgba(255,255,255,.2)}
.naml .count small{display:block;color:#D8EEF0;font-size:15px;margin-bottom:10px}
.naml .cells{display:flex;gap:10px;flex-wrap:wrap}
.naml .cell{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:6px;padding:10px 14px;min-width:80px;text-align:center}
.naml .cell b{display:block;font:400 40px/1 "Bebas Neue",sans-serif;color:var(--yellow);font-variant-numeric:tabular-nums}
.naml .cell i{font-style:normal;font-size:13px;color:#D8EEF0}
.naml .scene{width:100%;height:auto;display:block;border-radius:12px;box-shadow:8px 8px 0 var(--coral)}

.naml .phero{background:linear-gradient(180deg,var(--dteal),var(--deep));color:#fff;padding:clamp(40px,5vw,72px) max(5vw,16px);position:relative;overflow:hidden}
.naml .phero .wrap{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.7fr);gap:32px;align-items:center}
.naml .phero .crumb{color:var(--yellow);font-weight:600;margin-bottom:10px}
.naml .phero h1{font-size:clamp(48px,7vw,88px);text-shadow:4px 4px 0 var(--coral)}
.naml .phero p.lead{font-size:19px;color:#D8EEF0;max-width:640px;margin:16px 0 0}
.naml .phero svg{width:100%;max-width:300px;justify-self:end}

.naml .head{max-width:780px;margin-bottom:34px}
.naml .head h2{font-size:clamp(40px,5vw,58px);color:var(--dteal);margin-bottom:12px;text-shadow:3px 3px 0 var(--yellow)}
.naml .head p{color:var(--muted);font-size:17px}
.naml .facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.naml .facts div{background:var(--mist);border-radius:8px;padding:22px}
.naml .facts b{display:block;font:400 40px/1 "Bebas Neue",sans-serif;color:var(--teal);margin-bottom:4px}
.naml .facts span{color:var(--muted);font-size:15px}
.naml blockquote{margin:38px 0 0;padding:4px 0 4px 22px;border-left:5px solid var(--coral);font-size:21px;font-weight:600;max-width:780px;color:var(--dteal)}
.naml blockquote cite{display:block;margin-top:8px;font-size:15px;font-style:normal;color:var(--muted);font-weight:400}

.naml .timeline{list-style:none;margin:0 0 40px;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.naml .timeline li{background:#fff;border-radius:8px;padding:20px;border-top:6px solid var(--teal)}
.naml .timeline li.now{border-top-color:var(--coral)}
.naml .timeline li.now b{color:var(--coral)}
.naml .timeline li:last-child{border-top-color:var(--yellow)}
.naml .timeline b{display:block;font:400 30px/1.05 "Bebas Neue",sans-serif;color:var(--dteal);white-space:nowrap}
.naml .timeline span{color:var(--muted);font-size:15px}

.naml .two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(20px,3vw,40px)}
.naml .three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.naml .panel{background:#fff;border-radius:8px;padding:clamp(20px,3vw,32px)}
.naml .mist .panel{background:#fff}
.naml .band:not(.mist) .panel{background:var(--mist)}
.naml .panel h3{font-size:32px;color:var(--dteal);margin-bottom:12px}
.naml .panel ul{margin:0;padding-left:20px}
.naml .panel li{margin-bottom:8px}
.naml .panel li::marker{color:var(--teal)}
.naml .warn{background:#FFE9E7;border-left:5px solid var(--coral);border-radius:4px;padding:12px 14px;font-weight:600;margin-top:16px;color:#7A1C17}
.naml .panel.cta{background:var(--dteal);color:#fff}
.naml .cta h3{color:var(--yellow)}
.naml .note{color:var(--muted);font-size:14px;margin-top:14px}
.naml .cta .note{color:#BFE3E6}

.naml .types{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.naml .type{border-radius:8px;padding:24px;background:var(--mist);position:relative;overflow:hidden}
.naml .mist .type{background:#fff}
.naml .type::before{content:"";position:absolute;inset:0 auto 0 0;width:6px;background:var(--c,var(--teal))}
.naml .type b{display:block;font:400 48px/1 "Bebas Neue",sans-serif;color:var(--dteal);margin-bottom:6px}
.naml .type h3{font-size:26px;color:var(--dteal);margin-bottom:6px}
.naml .type p{color:var(--muted);font-size:15px;margin:0}

.naml .card{display:flex;flex-direction:column;text-decoration:none;background:#fff;border-radius:10px;overflow:hidden;border:1px solid var(--line);transition:transform .15s,box-shadow .15s}
.naml .card:hover{transform:translate(-3px,-3px);box-shadow:6px 6px 0 var(--yellow)}
.naml .card svg{display:block;width:100%;height:auto;aspect-ratio:16/9}
.naml .card div{padding:20px 22px 24px}
.naml .card h3{font-size:30px;color:var(--dteal);margin-bottom:6px}
.naml .card p{color:var(--muted);margin:0}
.naml .card .go{display:inline-block;margin-top:12px;font-weight:700;color:var(--coral-ink)}

.naml .venue{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(20px,4vw,48px);align-items:center;margin-bottom:clamp(40px,6vw,72px)}
.naml .venue:last-child{margin-bottom:0}
.naml .venue.flip>svg{order:2}
.naml .venue>svg{width:100%;height:auto;border-radius:12px;box-shadow:8px 8px 0 var(--c,var(--yellow))}
.naml .venue .days{display:inline-block;background:var(--c,var(--yellow));color:var(--deep);font:400 24px/1 "Bebas Neue",sans-serif;padding:8px 12px 6px;border-radius:4px;margin-bottom:14px}
.naml .venue h2{font-size:clamp(40px,4.6vw,56px);color:var(--dteal);margin-bottom:12px}
.naml .venue p{color:var(--muted);font-size:17px}
.naml .badge{display:block;background:var(--mist);border-radius:6px;padding:12px 14px;margin:0 0 18px;color:var(--ink)!important;font-size:15px!important}
.naml .badge b{color:var(--dteal)}

.naml .agenda{background:#fff;border-radius:8px;overflow:hidden;border:1px solid var(--line);box-shadow:6px 6px 0 var(--yellow)}
.naml .agenda iframe{display:block;width:100%;height:min(1000px,85vh);border:0;background:var(--mist)}
.naml .agenda .bar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 16px;background:var(--dteal);color:#fff;padding:12px 20px}
.naml .agenda .bar b{font:400 26px/1 "Bebas Neue",sans-serif;color:var(--yellow)}
.naml .agenda .bar a{color:#fff;font-weight:600}

.naml .years{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.naml .year{display:flex;flex-direction:column;justify-content:space-between;min-height:200px;text-decoration:none;border-radius:10px;padding:24px;background:var(--dteal);color:#fff;position:relative;overflow:hidden;transition:transform .15s,box-shadow .15s}
.naml .year:hover{transform:translate(-3px,-3px);box-shadow:6px 6px 0 var(--coral)}
.naml .year b{font:400 72px/.9 "Bebas Neue",sans-serif;color:var(--yellow)}
.naml .year span{font-weight:600}
.naml .year small{display:block;color:#E3F2F3;font-size:14px;margin-top:4px}
.naml .year.alt{background:#117680}
.naml .year.all{background:var(--yellow);color:var(--deep)}
.naml .year.all b{color:var(--deep)}
.naml .year.all small{color:var(--dteal)}
.naml .year::after{content:"";position:absolute;right:-40px;bottom:-40px;width:160px;height:160px;border-radius:50%;border:2px solid rgba(255,255,255,.18);box-shadow:0 0 0 24px rgba(255,255,255,.05),0 0 0 48px rgba(255,255,255,.04)}

.naml .org{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.naml .org div{border-radius:8px;padding:24px;background:var(--mist)}
.naml .mist .org div{background:#fff}
.naml .org b{display:block;font:400 32px/1.1 "Bebas Neue",sans-serif;color:var(--dteal);margin-bottom:4px}
.naml .org span{color:var(--muted)}

.naml .band.go{background:var(--yellow);color:var(--deep)}
.naml .go .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:20px}
.naml .go h2{font-size:clamp(36px,4.4vw,54px);color:var(--deep)}
.naml .go p{margin:6px 0 0;font-size:17px;font-weight:600}

.naml .foot{background:var(--deep);color:#BFE3E6}
.naml .foot .wrap{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) minmax(0,1fr);gap:32px}
.naml .foot img{width:200px;height:auto;display:block;margin-bottom:12px}
.naml .foot h3{color:var(--yellow);font-size:26px;margin-bottom:10px}
.naml .foot ul{list-style:none;margin:0;padding:0}
.naml .foot li{margin-bottom:6px}
.naml .foot a{color:#fff;text-decoration-color:rgba(255,255,255,.35)}
.naml .foot a:hover{color:var(--yellow)}
.naml .fine{border-top:1px solid rgba(255,255,255,.12);margin-top:36px;padding-top:18px;font-size:14px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px}

.naml .sweep{transform-box:view-box;transform-origin:center;animation:namlsweep 10s linear infinite}
.naml .bob{animation:namlbob 6s ease-in-out infinite}
@keyframes namlsweep{to{transform:rotate(360deg)}}
@keyframes namlbob{50%{transform:translateY(4px)}}
@media (prefers-reduced-motion:reduce){.naml .sweep,.naml .bob{animation:none}.naml .btn,.naml .card,.naml .year{transition:none}}

@media (max-width:900px){
  .naml .hero .wrap,.naml .two,.naml .venue,.naml .phero .wrap{grid-template-columns:minmax(0,1fr)}
  .naml .venue.flip>svg{order:0}
  .naml .phero svg{display:none}
  .naml .facts,.naml .timeline,.naml .types,.naml .three,.naml .years{grid-template-columns:repeat(2,minmax(0,1fr))}
  .naml .foot .wrap{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .naml .foot .wrap>div:first-child{grid-column:1/-1}
}
@media (max-width:600px){
  .naml .facts,.naml .timeline,.naml .types,.naml .three,.naml .years,.naml .org,.naml .foot .wrap{grid-template-columns:minmax(0,1fr)}
  .naml .cell{min-width:64px;padding:8px 10px}
  .naml .cell b{font-size:32px}
  .naml .btn{white-space:normal;text-align:center}
}

.naml .radar{justify-self:center;width:100%;max-width:520px}
.naml .radar svg{display:block;width:100%;height:auto}
@media (max-width:900px){.naml .radar{max-width:340px;order:-1}}
@media (max-width:600px){.naml .radar{max-width:240px}}

.naml .group{margin-bottom:clamp(40px,5vw,64px)}
.naml .ghead{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 20px;margin-bottom:24px;border-bottom:2px solid var(--line);padding-bottom:12px}
.naml .ghead h2{font-size:clamp(34px,4vw,46px);color:var(--dteal);text-shadow:3px 3px 0 var(--yellow)}
.naml .ghead a{color:var(--coral);font-weight:600}
.naml .people{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,240px));gap:24px}
.naml .person{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 10px 18px;transition:transform .2s,box-shadow .2s}
.naml .person:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(1,58,64,.14)}
.naml .ph{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:linear-gradient(135deg,var(--teal),var(--dteal));margin-bottom:14px}
.naml .ph::before{content:attr(data-i);position:absolute;inset:0;display:grid;place-items:center;font:400 64px/1 "Bebas Neue",sans-serif;color:rgba(255,255,255,.9)}
.naml .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .4s}
.naml .person:hover .ph img{transform:scale(1.04)}
.naml .person h3{font-size:26px;color:var(--dteal);margin:0 6px 2px}
.naml .person p{color:var(--muted);font-size:14px;margin:0 6px;line-height:1.4}
.naml .logos{display:flex;flex-wrap:wrap;gap:28px 36px}
.naml .orgl{display:flex;flex-direction:column;align-items:center;gap:12px;width:190px;text-align:center;text-decoration:none}
.naml .orgl .spon{width:170px}
.naml .orgl b{color:var(--dteal);font-weight:600;font-size:15px;line-height:1.35}
.naml .orgl:hover b{color:var(--coral)}
@media (max-width:600px){.naml .people{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.naml .logos{justify-content:center}.naml .orgl{width:calc(50% - 18px)}.naml .orgl .spon{width:100%}}

.naml .tier{display:grid;grid-template-columns:220px minmax(0,1fr);gap:28px;align-items:start;padding:28px 0;border-top:1px solid var(--line)}
.naml .tier:first-of-type{border-top:0;padding-top:0}
.naml .tier h3{font-size:34px;color:var(--dteal);margin:0 0 4px}
.naml .tier .tl small{display:block;color:var(--muted);font-size:14px}
.naml .tier .tl i{display:block;width:44px;height:6px;border-radius:3px;margin-bottom:12px;background:var(--c,var(--teal))}
.naml .spons{display:flex;flex-wrap:wrap;gap:14px}

.naml .spon{position:relative;display:grid;place-items:center;width:150px;aspect-ratio:1;background:#fff;border-radius:22px;padding:22px;border:1px solid var(--line);box-shadow:0 1px 2px rgba(1,58,64,.06),0 6px 18px rgba(1,58,64,.06);transition:transform .2s,box-shadow .2s}
.naml .spon:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(1,58,64,.14)}
.naml .diamond .spon{width:200px;padding:26px;border:3px solid var(--yellow)}
.naml .spon::before{content:attr(data-n);position:absolute;inset:0;display:grid;place-items:center;font:400 26px/1.1 "Bebas Neue",sans-serif;color:var(--teal);text-align:center;padding:10px}
.naml .spon img{position:relative;display:block;width:100%;height:100%;object-fit:contain;background:#fff;border-radius:12px}
@media (max-width:700px){.naml .tier{grid-template-columns:minmax(0,1fr);gap:14px}.naml .spon{width:calc(50% - 7px)}.naml .diamond .spon{width:180px}}

.naml .hero .jets{position:absolute;inset:0;width:100%;height:100%;opacity:.06;pointer-events:none}
.naml .hero .wrap{position:relative;z-index:1}
.naml .lockup{display:flex;align-items:center;flex-wrap:wrap;gap:6px 22px;max-width:500px;border-top:5px solid #fff;margin:16px 0 30px;padding-top:14px}
.naml .lockup .yr{font:400 clamp(72px,9vw,112px)/.82 "Bebas Neue",sans-serif;color:var(--yellow);text-shadow:5px 5px 0 var(--coral)}
