<svg viewBox="0 0 800 560" role="img" aria-label="Illustration: La Jolla coastline at sunset with palm trees and a hotel on the hill" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lj-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFC54B"/><stop offset=".55" stop-color="#FFA04B"/><stop offset="1" stop-color="#FF544B"/></linearGradient>
    <linearGradient id="lj-sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16929E"/><stop offset="1" stop-color="#02565E"/></linearGradient>
    <g id="lj-palm">
      <path d="M0 0 C4 -60 2 -120 10 -170" stroke="#013A40" stroke-width="9" fill="none" stroke-linecap="round"/>
      <g fill="#013A40" transform="translate(10 -170)">
        <path d="M0 0 C-30 -18 -60 -10 -82 14 C-56 0 -30 -2 0 6Z"/>
        <path d="M0 0 C30 -20 64 -14 86 10 C58 -2 30 -2 0 6Z"/>
        <path d="M0 0 C-14 -30 -40 -44 -66 -40 C-40 -30 -20 -18 -2 4Z"/>
        <path d="M0 0 C16 -32 42 -46 70 -40 C42 -30 22 -16 2 4Z"/>
        <path d="M0 0 C-4 -26 4 -48 14 -60 C10 -40 8 -20 4 2Z"/>
      </g>
    </g>
  </defs>
  <rect width="800" height="560" fill="url(#lj-sky)"/>
  <circle cx="250" cy="300" r="80" fill="#FFE29A"/>
  <g fill="#ffffff" fill-opacity=".25"><ellipse cx="560" cy="90" rx="110" ry="14"/><ellipse cx="640" cy="112" rx="70" ry="10"/><ellipse cx="160" cy="140" rx="80" ry="11"/></g>
  <rect y="320" width="800" height="240" fill="url(#lj-sea)"/>
  <g fill="#FFE29A" opacity=".7"><rect x="190" y="332" width="120" height="4" rx="2"/><rect x="210" y="346" width="80" height="3" rx="1.5"/><rect x="226" y="358" width="48" height="3" rx="1.5"/></g>
  <!-- waves -->
  <g fill="none" stroke="#ffffff" stroke-opacity=".35" stroke-width="3" stroke-linecap="round">
    <path d="M40 420 q20 -10 40 0 t40 0"/><path d="M160 470 q20 -10 40 0 t40 0"/><path d="M60 520 q20 -10 40 0 t40 0"/>
  </g>
  <!-- cliffs -->
  <path d="M380 560 L380 380 C420 360 440 330 480 318 C520 306 560 300 600 270 C650 236 720 230 800 226 L800 560 Z" fill="#02565E"/>
  <path d="M380 380 C400 400 410 440 400 470 C390 500 410 530 420 560 L380 560 Z" fill="#013A40"/>
  <path d="M470 330 C490 360 486 400 500 430 C512 456 504 500 520 560 L470 560 C460 500 470 460 452 420 C440 390 450 350 470 330Z" fill="#013A40" opacity=".7"/>
  <!-- hotel on the hill -->
  <g transform="translate(600 150)">
    <rect x="0" y="40" width="150" height="80" fill="#ffffff"/>
    <rect x="26" y="0" width="98" height="40" fill="#ffffff"/>
    <rect x="0" y="40" width="150" height="8" fill="#FFC54B"/>
    <g fill="#16929E">
      <rect x="12" y="58" width="16" height="12"/><rect x="40" y="58" width="16" height="12"/><rect x="68" y="58" width="16" height="12"/><rect x="96" y="58" width="16" height="12"/><rect x="124" y="58" width="16" height="12"/>
      <rect x="12" y="86" width="16" height="12"/><rect x="40" y="86" width="16" height="12"/><rect x="68" y="86" width="16" height="12"/><rect x="96" y="86" width="16" height="12"/><rect x="124" y="86" width="16" height="12"/>
      <rect x="38" y="12" width="14" height="12"/><rect x="66" y="12" width="14" height="12"/><rect x="94" y="12" width="14" height="12"/>
    </g>
    <rect x="8" y="120" width="134" height="6" fill="#FF544B"/>
  </g>
  <!-- palms -->
  <use href="#lj-palm" transform="translate(560 330)"/>
  <use href="#lj-palm" transform="translate(520 360) scale(.8)"/>
  <use href="#lj-palm" transform="translate(770 280) scale(.9)"/>
  <!-- seagulls -->
  <g fill="none" stroke="#013A40" stroke-width="3" stroke-linecap="round"><path d="M380 150 q10 -10 20 0 q10 -10 20 0"/><path d="M440 120 q8 -8 16 0 q8 -8 16 0"/></g>
</svg>
