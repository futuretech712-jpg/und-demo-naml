<svg viewBox="0 0 800 560" role="img" aria-label="Illustration: a research campus on the Point Loma peninsula at dusk, with antennas, a radar dish and sonar rings in the bay" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pl-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#013A40"/><stop offset=".7" stop-color="#02565E"/><stop offset="1" stop-color="#16929E"/></linearGradient>
    <linearGradient id="pl-sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16929E"/><stop offset="1" stop-color="#013A40"/></linearGradient>
  </defs>
  <rect width="800" height="560" fill="url(#pl-sky)"/>
  <g fill="#ffffff"><circle cx="90" cy="70" r="2"/><circle cx="210" cy="40" r="1.6"/><circle cx="330" cy="90" r="2"/><circle cx="470" cy="50" r="1.6"/><circle cx="700" cy="60" r="2"/><circle cx="620" cy="120" r="1.5"/><circle cx="150" cy="150" r="1.5"/></g>
  <circle cx="680" cy="110" r="34" fill="#FFC54B"/><circle cx="694" cy="100" r="30" fill="#013A40"/>
  <!-- peninsula -->
  <path d="M0 340 L0 250 C80 236 150 240 220 220 C300 198 380 210 460 236 C540 262 600 300 680 330 L800 352 L800 360 L0 360 Z" fill="#02565E"/>
  <path d="M0 360 L0 300 C120 292 260 300 400 322 C520 340 640 350 800 356 L800 360 Z" fill="#013A40"/>
  <!-- buildings -->
  <g fill="#ffffff">
    <rect x="120" y="230" width="120" height="70"/><rect x="250" y="210" width="90" height="90"/><rect x="350" y="236" width="140" height="64"/>
  </g>
  <rect x="120" y="230" width="120" height="8" fill="#FFC54B"/><rect x="250" y="210" width="90" height="8" fill="#FF544B"/><rect x="350" y="236" width="140" height="8" fill="#FFA04B"/>
  <g fill="#16929E">
    <rect x="134" y="252" width="20" height="12"/><rect x="166" y="252" width="20" height="12"/><rect x="198" y="252" width="20" height="12"/>
    <rect x="134" y="274" width="20" height="12"/><rect x="166" y="274" width="20" height="12"/><rect x="198" y="274" width="20" height="12"/>
    <rect x="262" y="232" width="18" height="12"/><rect x="292" y="232" width="18" height="12"/><rect x="262" y="256" width="18" height="12"/><rect x="292" y="256" width="18" height="12"/><rect x="262" y="280" width="18" height="12"/><rect x="292" y="280" width="18" height="12"/>
    <rect x="364" y="256" width="22" height="12"/><rect x="396" y="256" width="22" height="12"/><rect x="428" y="256" width="22" height="12"/><rect x="460" y="256" width="18" height="12"/>
  </g>
  <!-- antenna masts -->
  <g stroke="#FFC54B" stroke-width="3" fill="none">
    <path d="M560 300 L580 150 L600 300 M566 250 h28 M572 200 h16"/>
    <path d="M640 318 L654 200 L668 318 M646 270 h16"/>
  </g>
  <circle cx="580" cy="146" r="6" fill="#FF544B"/><circle cx="654" cy="196" r="5" fill="#FF544B"/>
  <!-- radar dish -->
  <g transform="translate(510 300)">
    <rect x="-6" y="-30" width="12" height="30" fill="#ffffff"/>
    <path d="M-40 -40 A44 44 0 0 0 30 -70 Z" fill="#ffffff" transform="rotate(-10)"/>
    <line x1="-4" y1="-52" x2="18" y2="-80" stroke="#ffffff" stroke-width="3"/>
  </g>
  <!-- bay with sonar -->
  <rect y="360" width="800" height="200" fill="url(#pl-sea)"/>
  <g transform="translate(560 470)" fill="none" stroke="#FFC54B" stroke-width="2">
    <circle r="22" stroke-opacity=".9"/><circle r="52" stroke-opacity=".6"/><circle r="86" stroke-opacity=".4"/><circle r="124" stroke-opacity=".22"/><circle r="166" stroke-opacity=".12"/>
  </g>
  <circle cx="563" cy="473" r="9" fill="#FF544B"/><circle cx="560" cy="470" r="9" fill="#FFC54B"/>
  <g fill="none" stroke="#ffffff" stroke-opacity=".3" stroke-width="3" stroke-linecap="round"><path d="M60 420 q20 -10 40 0 t40 0"/><path d="M200 490 q20 -10 40 0 t40 0"/></g>
</svg>
